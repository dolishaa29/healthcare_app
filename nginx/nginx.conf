worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Standard trick for a location that must serve both plain HTTP and
    # WebSocket upgrades: only send "Connection: upgrade" when the client
    # actually asked for one, otherwise nginx would send it on every
    # request, which regular REST calls don't expect.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream backend_pool {
        # Sticky sessions by client IP. Chat/meeting state itself no longer
        # depends on this (the Socket.IO Redis adapter — see
        # Backend/socket/chatSocket.js — makes broadcasts work correctly
        # across instances regardless of routing), but Engine.IO's initial
        # handshake still goes through a plain HTTP long-poll before
        # upgrading to a WebSocket, and that sequence needs to land on the
        # same instance. ip_hash keeps that intact.
        ip_hash;
        server backend1:5000 max_fails=3 fail_timeout=30s;
        server backend2:5000 max_fails=3 fail_timeout=30s;
    }

    client_max_body_size 10m;

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://backend_pool;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Chat/meeting sockets are long-lived — the 60s default read
            # timeout would silently kill an idle-but-open WebSocket
            # connection and force constant reconnects.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
